name: Spider Jar Gen

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clone FongMi CatVodSpider
        run: |
          rm -rf project
          rm -rf jar/custom_spider.jar
          git clone --recurse-submodules https://github.com/FongMi/CatVodSpider project

      - name: Customize Spider
        working-directory: ./project
        run: |
          sed -i 's/gradle-7.4.2-all/gradle-7.5-bin/g' gradle/wrapper/gradle-wrapper.properties
          # 在这里添加你的自定义修改

      - name: Build with Gradle
        working-directory: ./project
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease --build-cache --parallel --daemon --quiet

      - name: Prepare Tools
        run: |
          mkdir -p jar/3rd
          curl -sL -o jar/3rd/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -sL -o jar/3rd/baksmali.jar https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar

      - name: Build Spider Jar
        working-directory: ./project
        run: |
          rm -rf jar/custom_spider.jar
          rm -rf jar/spider.jar/original/META-INF

          # baksmali: dex -> smali
          java -jar ../jar/3rd/baksmali.jar d             app/build/intermediates/dex/release/minifyReleaseWithR8/classes.dex             -o jar/Smali_classes

          # 重组 smali 到 spider.jar 模板
          mkdir -p jar/spider.jar/smali/com/github/catvod/
          mv jar/Smali_classes/com/github/catvod/spider jar/spider.jar/smali/com/github/catvod/

          # apktool: smali -> dex.jar
          java -jar ../jar/3rd/apktool.jar b jar/spider.jar -c
          mv jar/spider.jar/dist/dex.jar ../jar/custom_spider.jar

          # 生成 MD5
          md5=$(md5sum ../jar/custom_spider.jar | awk '{print $1}')
          echo "$md5" > ../jar/custom_spider.jar.md5
          echo "MD5: $md5"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider
          path: |
            ./jar/custom_spider.jar
            ./jar/custom_spider.jar.md5

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'update spider jar'
          add: |
            jar/custom_spider.jar
            jar/custom_spider.jar.md5
